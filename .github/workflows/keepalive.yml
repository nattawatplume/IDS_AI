---
name: Keep the Space awake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SPACE_URL: ${{ vars.SPACE_URL }}
    steps:
      - name: Check the variable
        run: |
          [ -n "$SPACE_URL" ] || { echo "ยังไม่ได้ตั้ง SPACE_URL" >&2; exit 1; }
      - name: Ping the Space
        run: curl -fsS --retry 5 --retry-delay 30 --max-time 120 "https://$SPACE_URL/api/health"
