[project]
name = "idsai"
version = "0.1.0"
description = "Market IDS: crypto market-manipulation anomaly detection (educational)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "duckdb>=2.0.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "polars>=2.1.0",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["idsai"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running tests",
    "network: tests that need network access",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[dependency-groups]
dev = [
    "hypothesis>=6.170.12",
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]
