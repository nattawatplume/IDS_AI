---
name: Keep the app awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      APP_URL: ${{ vars.APP_URL }}
    steps:
      - name: Check the variable
        run: |
          [ -n "$APP_URL" ] || { echo "ยังไม่ได้ตั้ง APP_URL" >&2; exit 1; }
      - name: Ping the app
        run: curl -fsS --retry 5 --retry-delay 30 --max-time 120 "https://$APP_URL/api/health"
