services:
  - type: web
    name: market-ids
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: IDSAI_USERS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: IDSAI_PUBLIC_URL
        sync: false
      - key: IDSAI_MODE
        value: live
